<!-- 渲染列表 -->

<!-- 链式调用 -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>props属性</title>

    <!-- ✅ 使用 defer 属性，脚本会在DOM加载后执行 -->
    <script defer src="../js/umd/react.development.js"></script>
    <script defer src="../js/umd/react-dom.development.js"></script>
    <script defer src="../js/babel.min.js"></script>
    <!-- 引入 PropTypes 库 -->
    <script
      defer
      src="https://unpkg.com/prop-types@15.8.1/prop-types.js"
    ></script>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      // 子组件：显示单个人员信息
      class PersonInfo extends React.Component {
        render() {
          // 从props中获取数据
          const { name, age } = this.props;

          return (
            <li>
              姓名：{name}，年龄：{age}
            </li>
          );
        }
      }

      // 定义props类型约束（可选但推荐）
      PersonInfo.propTypes = {
        name: PropTypes.string.isRequired, // 姓名必须是字符串
        age: PropTypes.number.isRequired, // 年龄必须是数字
      };

      // 父组件：员工列表
      class Mycomp extends React.Component {
        render() {
          return (
            <div>
              <h1>员工列表</h1>
              <ul>
                {/* 通过props传递数据给子组件 */}
                <PersonInfo name="张三" age={28} />
                <PersonInfo name="李四" age={32} />
                <PersonInfo name="王五" age={25} />
              </ul>
            </div>
          );
        }
      }

      // 渲染到页面（React 17及以下版本使用render方法）
      ReactDOM.render(<Mycomp />, document.getElementById("root"));
    </script>
  </body>
</html>
